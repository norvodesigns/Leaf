name: iOS

# Compile check, unit tests and simulator screenshots on a GitHub-hosted Mac.
# No signing and no secrets: this never uploads anything to Apple.
# TestFlight uploads happen from Xcode on your Mac (see docs/TESTFLIGHT.md).

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

# A running build finishes; GitHub keeps only the newest pending run behind it,
# so with several pushes a full run (archive and screenshots) still completes.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    # Build and tests take about 35 minutes; the App Store set, the watch and the design screenshots up to 120 more.
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check project structure
        run: |
          python3 scripts/check_pbxproj.py --summary
          plutil -lint Config/Info.plist Config/LeafWidgets-Info.plist Leaf/Leaf.entitlements LeafWidgets/LeafWidgets.entitlements LeafWidgets/PrivacyInfo.xcprivacy

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Pick simulators
        run: |
          python3 scripts/ci_pick_simulators.py >> "$GITHUB_ENV"
          cat "$GITHUB_ENV"

      - name: Build and test (iPhone + embedded watch app)
        run: |
          set -o pipefail
          xcodebuild -project Leaf.xcodeproj -scheme Leaf \
            -destination "id=$IOS_SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            test 2>&1 | tee build-ios.log | xcbeautify --quieter || { echo "::group::Errors"; grep -E "error:|failed|Failing tests|✘" build-ios.log | sort -u | head -300; echo "::endgroup::"; exit 1; }

      # The ambience previews, rendered with the app's own synthesis, go to a hidden ref like the screenshots:
      # `git fetch origin refs/ci/audio` (see docs/AUDIO_SOURCES.md).
      - name: Render ambience previews
        if: success()
        timeout-minutes: 10
        run: bash scripts/render_ambience_previews.sh audio-previews

      - name: Publish ambience previews to refs/ci/audio
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls audio-previews/*.m4a >/dev/null 2>&1 || { echo "no previews to publish"; exit 0; }
          cat audio-previews/MEASURES.md
          dir=$(mktemp -d)
          cp audio-previews/* "$dir/"
          cd "$dir"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Ambience previews of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/audio \
            && echo "published previews to refs/ci/audio" || echo "could not publish previews"

      - name: Build watch app for the watch simulator
        if: env.WATCH_SIM != ''
        run: |
          set -o pipefail
          xcodebuild -project Leaf.xcodeproj -scheme LeafWatch \
            -destination "id=$WATCH_SIM" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee build-watch.log | xcbeautify --quieter || { echo "::group::Errors"; grep -E "error:" build-watch.log | sort -u | head -300; echo "::endgroup::"; exit 1; }

      - name: Device archive (unsigned) and packaging check
        run: |
          set -o pipefail
          xcodebuild -project Leaf.xcodeproj -scheme Leaf -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/Leaf.xcarchive \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO \
            archive 2>&1 | tee build-archive.log | xcbeautify --quieter || { grep -E "error:" build-archive.log | sort -u | head -100; exit 1; }
          APP=build/Leaf.xcarchive/Products/Applications/Leaf.app
          echo "--- Leaf.app"; ls "$APP" | head -40
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|UIDeviceFamily|ITSAppUses|CFBundleIcons|UIAppFonts|DTPlatformName|LSApplicationCategoryType|NSSupportsLiveActivities|UIBackgroundModes|remote-notification"
          WATCH="$APP/Watch/LeafWatch.app"
          echo "--- LeafWatch.app"; ls "$WATCH" | head -30
          plutil -p "$WATCH/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|WK|MinimumOSVersion|DTPlatformName|UIDeviceFamily"
          APPEX="$APP/PlugIns/LeafWidgets.appex"
          fail() { echo "::error::$1"; exit 1; }
          plist_value() { /usr/libexec/PlistBuddy -c "Print :$2" "$1" 2>/dev/null; }
          [ -d "$APPEX" ] || fail "LeafWidgets.appex is not embedded in Leaf.app/PlugIns"
          [ -f "$APPEX/Info.plist" ] || fail "LeafWidgets.appex has no Info.plist"
          echo "--- LeafWidgets.appex"; ls "$APPEX" | head -30
          plutil -p "$APPEX/Info.plist" | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleVersion|MinimumOSVersion|DTPlatformName|NSExtension|NSExtensionPointIdentifier"
          [ "$(plist_value "$APPEX/Info.plist" NSExtension:NSExtensionPointIdentifier)" = "com.apple.widgetkit-extension" ] || fail "LeafWidgets.appex Info.plist does not declare the com.apple.widgetkit-extension extension point"
          [ "$(plist_value "$APPEX/Info.plist" CFBundleIdentifier)" = "com.norvodesigns.leaf.widgets" ] || fail "LeafWidgets.appex has the wrong bundle id"
          [ "$(plist_value "$APPEX/Info.plist" CFBundleVersion)" = "$(plist_value "$APP/Info.plist" CFBundleVersion)" ] || fail "LeafWidgets.appex build number differs from the app"
          [ "$(plist_value "$APPEX/Info.plist" CFBundleShortVersionString)" = "$(plist_value "$APP/Info.plist" CFBundleShortVersionString)" ] || fail "LeafWidgets.appex version differs from the app"
          [ "$(plist_value "$APP/Info.plist" NSSupportsLiveActivities)" = "true" ] || fail "Leaf.app Info.plist is missing NSSupportsLiveActivities = YES"
          [ "$(plist_value "$APP/Info.plist" NSSupportsLiveActivitiesFrequentUpdates)" = "false" ] || fail "Leaf.app Info.plist should set NSSupportsLiveActivitiesFrequentUpdates = NO"
          plist_value "$APP/Info.plist" UIBackgroundModes | grep -q "remote-notification" || fail "Leaf.app Info.plist is missing the remote-notification background mode"
          WAPPEX="$WATCH/PlugIns/LeafWatchWidgets.appex"
          [ -d "$WAPPEX" ] || fail "LeafWatchWidgets.appex is not embedded in LeafWatch.app/PlugIns"
          echo "--- LeafWatchWidgets.appex"; ls "$WAPPEX" | head -20
          [ "$(plist_value "$WAPPEX/Info.plist" NSExtension:NSExtensionPointIdentifier)" = "com.apple.widgetkit-extension" ] || fail "LeafWatchWidgets.appex Info.plist does not declare the com.apple.widgetkit-extension extension point"
          [ "$(plist_value "$WAPPEX/Info.plist" CFBundleIdentifier)" = "com.norvodesigns.leaf.watchkitapp.widgets" ] || fail "LeafWatchWidgets.appex has the wrong bundle id"
          [ "$(plist_value "$WAPPEX/Info.plist" CFBundleVersion)" = "$(plist_value "$WATCH/Info.plist" CFBundleVersion)" ] || fail "LeafWatchWidgets.appex build number differs from the watch app"
          plist_value "$WATCH/Info.plist" WKBackgroundModes | grep -q "mindfulness" || fail "LeafWatch.app Info.plist is missing the mindfulness background mode (extended runtime)"
          echo "widget extensions embedded and declared correctly"
          # Required-reason APIs: every bundle whose executable reaches UserDefaults must say so in its own manifest
          # (App Store Connect rejects the upload otherwise, ITMS-91053).
          for BUNDLE in $(find "$APP" -type d \( -name "*.app" -o -name "*.appex" \)); do
            NAME=$(basename "$BUNDLE")
            EXE="$BUNDLE/$(plist_value "$BUNDLE/Info.plist" CFBundleExecutable)"
            [ -f "$EXE" ] || fail "$NAME has no executable at $EXE"
            if { xcrun nm -u "$EXE" 2>/dev/null; strings -a "$EXE"; } | grep -q "NSUserDefaults"; then
              [ -f "$BUNDLE/PrivacyInfo.xcprivacy" ] || fail "$NAME uses UserDefaults but has no PrivacyInfo.xcprivacy"
              plutil -p "$BUNDLE/PrivacyInfo.xcprivacy" | grep -q "NSPrivacyAccessedAPICategoryUserDefaults" || fail "$NAME uses UserDefaults but its PrivacyInfo.xcprivacy doesn't declare NSPrivacyAccessedAPICategoryUserDefaults"
              echo "$NAME: UserDefaults declared"
            else
              echo "$NAME: no UserDefaults"
            fi
          done
          test -f "$APP/catalog.sqlite" && echo "catalog.sqlite bundled ($(wc -c < "$APP/catalog.sqlite") bytes)"
          test -f "$APP/PrivacyInfo.xcprivacy" && echo "iOS privacy manifest bundled"
          test -f "$WATCH/PrivacyInfo.xcprivacy" && echo "watch privacy manifest bundled"
          ls "$APP" | grep -E "Assets.car|InstrumentSerif" || true
          # Also published beside the screenshots (sizes.txt), for machines that can't read job logs.
          echo "sizes (KB, unsigned, uncompressed): Leaf.app $(du -sk "$APP" | cut -f1), Leaf executable $(du -k "$APP/Leaf" | cut -f1), LeafWatch.app $(du -sk "$WATCH" | cut -f1), LeafWatch executable $(du -k "$WATCH/LeafWatch" 2>/dev/null | cut -f1)" | tee build-sizes.txt

      - name: Warnings
        if: always()
        run: grep -h -E "warning:" build-*.log 2>/dev/null | grep -v -E "appintents|Metadata extraction" | sort -u | head -150 || true

      # The App Store set first (6.9-inch iPhone at 1320x2868 and the watch, public-domain books only: store-*.png),
      # then the watch, each in its own step so the long design run can't cut them off.
      - name: App Store screenshots
        if: success()
        continue-on-error: true
        timeout-minutes: 20
        run: bash scripts/ci_screenshots.sh screenshots store

      - name: Watch screenshots
        if: success()
        continue-on-error: true
        timeout-minutes: 15
        run: bash scripts/ci_screenshots.sh screenshots watch

      - name: Screenshots
        if: success()
        timeout-minutes: 85
        run: bash scripts/ci_screenshots.sh screenshots design

      # Some machines that review the design can reach github.com but not the storage that serves logs and artifacts.
      # The JPEG copies also go to a hidden ref (not a branch or a tag), replaced on every run:
      # `python3 scripts/ci.py shots` falls back to `git fetch origin refs/ci/screenshots`.
      - name: Publish screenshots to refs/ci/screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls screenshots/jpg/*.jpg >/dev/null 2>&1 || { echo "no screenshots to publish"; exit 0; }
          dir=$(mktemp -d)
          cp screenshots/jpg/*.jpg "$dir/"
          cp build-sizes.txt "$dir/sizes.txt" 2>/dev/null || true
          cd "$dir"
          git init -q
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Screenshots of ${GITHUB_SHA} (run ${GITHUB_RUN_ID})"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/ci/screenshots \
            && echo "published $(ls *.jpg | wc -l) screenshots to refs/ci/screenshots" || echo "could not publish screenshots"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
          retention-days: 7
